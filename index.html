<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Topic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #f4f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Countdown Header Block */
    .countdown-card {
      background: #ffffff;
      width: 100%;
      padding: 24px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      border: 1px solid #e1e4e8;
      text-align: center;
      margin-bottom: 20px;
    }

    .days-count {
      font-size: 3.2rem;
      font-weight: 800;
      color: #ef4444; /* Material Light Red */
      line-height: 1;
      letter-spacing: -0.03em;
      text-shadow: 0 4px 12px rgba(239, 68, 68, 0.12);
    }

    .days-label {
      margin-top: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #64748b; /* Slate Gray */
      letter-spacing: 0.01em;
    }

    /* Minimalist Task Card Container */
    .card {
      background: #ffffff;
      width: 100%;
      padding: 36px 32px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      transition: background-color 0.4s ease, border-color 0.4s ease;
      border: 1px solid #e1e4e8;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #111111;
      margin-bottom: 24px;
      transition: color 0.3s ease;
    }

    ul { list-style: none; }

    .empty-state {
      text-align: center;
      color: #a1a1aa;
      font-size: 0.95rem;
      padding: 8px 0 18px 0;
      font-style: italic;
    }

    .task-item {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
      gap: 14px;
    }

    .custom-checkbox {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #a4a9bd;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      position: relative;
      flex-shrink: 0;
    }

    .custom-checkbox:checked {
      background-color: #16a34a;
      border-color: #16a34a;
    }

    .custom-checkbox:checked::after {
      content: '✓';
      position: absolute;
      color: white;
      font-size: 14px;
      top: -2px;
      left: 3px;
      font-weight: bold;
    }

    .task-text {
      flex: 1;
      font-size: 1.0rem;
      color: #1a1a1a;
      word-break: break-word;
      user-select: none;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #71717a;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.2s ease, color 0.2s ease, transform 0.2s ease;
      padding: 2px 6px;
    }

    .task-item:hover .delete-btn { 
      opacity: 1; 
      transform: scale(1);
    }
    
    .delete-btn:hover { color: #ef4444; }

    @media (hover: none) {
      .delete-btn {
        opacity: 0.6;
        transform: scale(1);
      }
    }

    .add-container { margin-top: 12px; }

    #newTaskInput {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1rem;
      color: #71717a;
      padding: 6px 0;
    }

    #newTaskInput::placeholder { color: #a1a1aa; }

    /* Green completion state */
    .card.all-completed {
      background-color: #dcfce7;
      border-color: #86efac;
    }

    .card.all-completed h1 { color: #15803d; }

    /* Button linking to Subject Progress with Dynamic Fill */
    .progress-btn {
      margin-top: 24px;
      width: 100%;
      padding: 18px 20px;
      background-color: #ffffff;
      color: #15803d;
      border: 1.5px solid #86efac;
      border-radius: 20px;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: block;
      position: relative;
      overflow: hidden;

      background-image: linear-gradient(to right, #bbf7d0 var(--progress-fill, 0%), #ffffff var(--progress-fill, 0%));
    }

    .progress-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="main-wrapper">

    <!-- Top Countdown Block -->
    <div class="countdown-card">
      <div class="days-count" id="daysCountDisplay">--</div>
      <div class="days-label" id="daysLabelDisplay">Days to achieve 50%</div>
    </div>

    <!-- Daily Task Card -->
    <div class="card" id="taskCard">
      <h1 id="cardHeader">Today's Topic</h1>
      <ul id="taskList"></ul>
      <div class="add-container">
        <input type="text" id="newTaskInput" placeholder="+ Add new task..." />
      </div>
    </div>

    <!-- Overall Progress Button -->
    <a href="subjects.html" class="progress-btn" id="overallProgressBtn">
      Overall Progress 0%
    </a>
  </div>

<script>
  // Dynamic Countdown Target Configuration
  const TARGET_DATE = new Date("2026-09-15T00:00:00"); // Set your target deadline
  const TARGET_PERCENTAGE = 50; // Set your target percentage (n%)

  function calculateDaysLeft() {
    const now = new Date();
    const timeDiff = TARGET_DATE - now;
    const daysLeft = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
    return Math.max(0, daysLeft);
  }

  function updateCountdownHeader() {
    const days = calculateDaysLeft();
    document.getElementById('daysCountDisplay').textContent = days;
    document.getElementById('daysLabelDisplay').textContent = `Days to achieve ${TARGET_PERCENTAGE}%`;
  }

  updateCountdownHeader();

  // Firebase Setup
  const firebaseConfig = {
    databaseURL: "https://todo-list-77a25-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  const tasksRef = db.ref('tasks');
  const subjectsRef = db.ref('subject_progress');

  const taskCard = document.getElementById('taskCard');
  const cardHeader = document.getElementById('cardHeader');
  const taskList = document.getElementById('taskList');
  const newTaskInput = document.getElementById('newTaskInput');
  const overallProgressBtn = document.getElementById('overallProgressBtn');

  const TOTAL_CHAPTERS_ALL_SUBJECTS = 113;

  let currentPercentage = 0;
  let animationFrameId = null;

  // LocalStorage instant task load
  let tasks = JSON.parse(localStorage.getItem('cached_tasks') || '[]');
  renderTasks();

  // Sync daily tasks from Firebase
  tasksRef.on('value', (snapshot) => {
    const data = snapshot.val();
    tasks = data ? Object.values(data) : [];
    localStorage.setItem('cached_tasks', JSON.stringify(tasks));
    renderTasks();
  });

  // Calculate Overall Progress & Trigger Smooth Animation
  subjectsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      animateProgressTo(0);
      return;
    }

    let checkedCount = 0;

    Object.values(data).forEach(subjectObj => {
      if (subjectObj && typeof subjectObj === 'object') {
        Object.values(subjectObj).forEach(isChecked => {
          if (isChecked === true) {
            checkedCount++;
          }
        });
      }
    });

    const targetPercentage = Math.round((checkedCount / TOTAL_CHAPTERS_ALL_SUBJECTS) * 100);
    animateProgressTo(targetPercentage);
  });

  // Smooth JS animation function for percentage text and fill width
  function animateProgressTo(targetPercent) {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);

    const startPercent = currentPercentage;
    const duration = 800; // Smooth 0.8s transition
    const startTime = performance.now();

    function updateFrame(currentTime) {
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / duration, 1);
      
      const easeProgress = 1 - Math.pow(1 - progress, 3);
      
      const interpolatedValue = startPercent + (targetPercent - startPercent) * easeProgress;
      currentPercentage = interpolatedValue;

      overallProgressBtn.textContent = `Overall Progress ${Math.round(interpolatedValue)}%`;
      overallProgressBtn.style.setProperty('--progress-fill', `${interpolatedValue}%`);

      if (progress < 1) {
        animationFrameId = requestAnimationFrame(updateFrame);
      } else {
        currentPercentage = targetPercent;
      }
    }

    animationFrameId = requestAnimationFrame(updateFrame);
  }

  function saveToCloud() { 
    localStorage.setItem('cached_tasks', JSON.stringify(tasks));
    tasksRef.set(tasks); 
  }

  function renderTasks() {
    taskList.innerHTML = '';

    if (tasks.length === 0) {
      taskList.innerHTML = '<li class="empty-state">No targets added yet</li>';
    } else {
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        li.innerHTML = `
          <input type="checkbox" class="custom-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})" />
          <span class="task-text">${escapeHtml(task.text)}</span>
          <button class="delete-btn" onclick="deleteTask(${index})" aria-label="Delete task">✕</button>
        `;
        taskList.appendChild(li);
      });
    }
    
    checkCompletionState();
  }

  function toggleTask(index) {
    tasks[index].completed = !tasks[index].completed;
    saveToCloud();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    saveToCloud();
  }

  newTaskInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && newTaskInput.value.trim() !== '') {
      tasks.push({ id: Date.now(), text: newTaskInput.value.trim(), completed: false });
      newTaskInput.value = '';
      saveToCloud();
    }
  });

  function checkCompletionState() {
    const allDone = tasks.length > 0 && tasks.every(t => t.completed);
    if (allDone) {
      taskCard.classList.add('all-completed');
      cardHeader.textContent = 'Good job 🎉';
    } else {
      taskCard.classList.remove('all-completed');
      cardHeader.textContent = "Today's Topic";
    }
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>

</body>
</html>
